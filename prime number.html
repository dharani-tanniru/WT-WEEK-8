<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prime numbers</title>
</head>
<body>
<script>
let n = 7;
let i;
for (i = 2; i < n; i++) {
    if (n % i == 0) {
        break;
    }
}
if (n > 1 && i == n) {
    document.write("Prime Number");
} else {
    document.write("Not Prime");
}
</script>
</body>
</html>
