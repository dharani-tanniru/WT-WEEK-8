<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>perfect number</title>
</head>
<body>
    <script>
        let n=6;
        let sum=0;
        for(let i=1;i<n;i++){
            if(n%i==0){
                sum=sum+i;
            }
        }
        if(sum==n){
            document.write("perfect number");
        }
        else{
            document.write("Not a Perfect");
        }
    </script>
</body>
</html>
